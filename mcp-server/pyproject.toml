[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agile-portal-mcp-server"
version = "0.1.0"
description = "Read-only MCP server for Agile Sourcing Portal"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=2.2.0,<3.0.0",
  "PyMySQL>=1.1.1,<2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0,<9.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
